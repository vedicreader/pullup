[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pullup"
dynamic = ["version"]
description = "build, release, and deploy projects"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Karthik Rajgopal", email = "karthik.rajgopal@hotmail.com"}]
keywords = ['nbdev', 'jupyter', 'notebook', 'python']
classifiers = ["Natural Language :: English", "Intended Audience :: Developers", "Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
dependencies = ['fastcore>=1.8.17', 'ptymini>=0.0.5', 'pyyaml>=6.0', 'dockeasy>=0.0.5',
                'gheasy>=0.0.10', 'vpseasy>=0.0.18', 'cfeasy>=0.0.4', 'python-dotenv>=1.0.0',
                'keyring>=25.0.0']

[project.urls]
Repository = "https://github.com/vedicreader/pullup"
Documentation = "https://vedicreader.github.io/pullup"

[project.entry-points.nbdev]
pullup = "pullup._modidx:d"

[tool.hatch.version]
path = "pullup/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pullup"]

[tool.hatch.build.targets.sdist]
include = ["/pullup", "/README.md", "/pyproject.toml"]

[tool.nbdev]
doc_host = "https://vedicreader.github.io"
doc_baseurl = "/pullup"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = ['pytest>=8.0.0', 'pytest-asyncio>=1.0.0', 'nbdev>=3.3.11']